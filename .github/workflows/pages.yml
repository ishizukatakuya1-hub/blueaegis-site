# ビルドして GitHub Pages へ配信
#
# main への push を契機に tools/build.js を実行し、_site/ を配信する。
# 記事のMarkdownはこのビルドでHTMLになるため、生成物はリポジトリに置かない。
name: サイトの配信

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は同時に1本だけ。実行中のものは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ビルド
        run: node tools/build.js

      - name: パンくず（BreadcrumbList）の検査
        run: node scripts/check-breadcrumbs.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
