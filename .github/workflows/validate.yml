# 記事の検証（PR用）
#
# 自動投稿のPRに対して、frontmatterの必須項目・出典・ファイル名規約・
# ビルドの成否を確認する。auto-merge へ切り替える際の前提になる。
#
# ビルドの中でサイト全体の検査（canonical・重複・リンク切れ・構造化データ・
# フェードイン対象のずれ）も走るので、記事以外の壊れもここで止まる。
name: 記事の検証

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 依存パッケージなし。生成スクリプトは標準ライブラリのみで動く。
      - name: frontmatter と出典の検証
        run: node tools/build.js --validate-only

      - name: ビルドとサイト全体の検査
        run: node tools/build.js

      # パンくずは Search Console でしか壊れが見えなかったので、ここで止める
      - name: パンくず（BreadcrumbList）の検査
        run: node scripts/check-breadcrumbs.js
